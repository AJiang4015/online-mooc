server:
#  port: 9999
  port: 8094
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: dev
  application:
    name: chat-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs:
          - dataId: shared-spring.yaml
          - dataId: shared-redis.yaml
          - dataId: shared-mybatis.yaml
          - dataId: shared-logs.yaml
          - dataId: shared-feign.yaml
          - dataId: shared-qdrant.yaml
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.chat.controller
    title: 智慧MOOC - AI智能对话中心接口文档
    description: 该服务提供AI聊天、AI知识库分析等功能
    contact-name: 研发院
    contact-url: http://www.itcast.cn/
    contact-email: 1418875140@qq.com
    version: v1.0
  jdbc:
    database: tj_chat
  auth:
    resource:
      enable: true
      excludeLoginPaths:
  mq:
    listener:
      retry:
        stateless: false
langchain4j:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: sk-b11d4aff59b74716a4ebebabb8a3906e
  model-name: qwen-plus
  embedding-model-name: text-embedding-v4
  embedding-dimensions: 1024
  max-tokens: 1000
  timeout-seconds: 15
  max-retries: 3
  chat-model-temperature: 0.4
  streaming-chat-model-temperature: 0.7
qdrant:
  vector-size: 1024
