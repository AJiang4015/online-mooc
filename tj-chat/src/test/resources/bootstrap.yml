server:
  port: 9999
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: dev
  application:
    name: chat-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs:
          - dataId: shared-spring.yaml
          - dataId: shared-redis.yaml
          - dataId: shared-mybatis.yaml
          - dataId: shared-logs.yaml
          - dataId: shared-feign.yaml
          - dataId: shared-qdrant.yaml
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.chat.controller
    title: 智慧MOOC - AI智能对话中心接口文档
    description: 该服务提供AI聊天、AI知识库分析等功能
    contact-name: 研发院
    contact-url: http://www.itcast.cn/
    contact-email: 1418875140@qq.com
    version: v1.0
  jdbc:
    database: tj_chat
  auth:
    resource:
      enable: true
      excludeLoginPaths:
  mq:
    listener:
      retry:
        stateless: false
langchain4j:
  base-url: ${TJ_AI_BASE_URL:http://localhost:11434/v1}
  api-key: ${TJ_AI_API_KEY:EMPTY}
  max-tokens: ${TJ_AI_MAX_TOKENS:1000}
  timeout-seconds: ${TJ_AI_TIMEOUT_SECONDS:15}
#  model-name: deepseek-r1:1.5b
  model-name: ${TJ_AI_MODEL_NAME:qwen3:0.6b}
  embedding-model-name: ${TJ_AI_EMBEDDING_MODEL_NAME:bge-m3:latest}
  max-retries: ${TJ_AI_MAX_RETRIES:3}
  chat-model-temperature: ${TJ_AI_CHAT_TEMPERATURE:0.4}
  streaming-chat-model-temperature: ${TJ_AI_STREAMING_TEMPERATURE:0.7}
